mode: parallel
max: 20
max_exceeded: warning
blueprint:
  name: 🔔 Notifications (Version 3.0.1)
  source_url: https://github.com/sandreialexandru/Notification-script-for-Home-Assistant/blob/main/notifications_v3.yaml
  homeassistant:
    min_version: 2024.10.0
  domain: script
  author: sandreialexandru (based on samuelthng/t-house-blueprints)
  description: >-
    <div>
      <h2>🔔 Notifications</h2>
      <b>Version 3.0</b> | 🔗 <a href="https://github.com/sandreialexandru/Notification-script-for-Home-Assistant/blob/main/notifications_v3.yaml" target="_blank">Github Link</a> | 📖 <a href="https://github.com/sandreialexandru/Notification-script-for-Home-Assistant" target="_blank">Documentation</a>
      </div>
      <br>

    <b>🙏 Based on</b> <a href="https://github.com/samuelthng/t-house-blueprints/blob/main/notifications.yaml" target="_blank">🔔 Notifications v2.0.2</a>
    by <a href="https://github.com/samuelthng" target="_blank">@samuelthng</a>
    (💬 <a href="https://community.home-assistant.io/t/notifications-actionable-mobile-notifications-script-with-optional-timeout-feature-and-camera-snapshots-works-with-ios-android/551552" target="_blank">original Community Post</a>).
    All credit for the original idea and structure goes to him.

    ---

    ### Features

      > 📲 Sends to **one or more** [Home Assistant Companion](https://companion.home-assistant.io/) devices (Android and iOS mixed)

      > 👥 Multiple devices: **first answer wins**; on the other devices the notification is
      > updated with who answered and what they chose (buttons removed)

      > 🚦 **One urgency selector** (Info / Normal / Important / Critical), translated automatically for Android and iOS

      > 🌙 Quiet hours · 🏠 Presence filter · 🗣️ Android TTS · 🖼️ Camera or URL image · 🎵 Custom iOS sound

      > 3️⃣ Up to 3 action buttons · ⌛️ Timeout with its own actions · 🔗 Notification link

    ### Changelog

      **v3.0** — multiple devices, unified urgency selector (one Android channel per level),
      quiet hours, presence filter, TTS, image from URL, advanced Android options, iOS sound,
      collapsible sections, `action:`/`trigger:` syntax, `mode: parallel`.
      Fixed: option 3 field example, copy-pasted descriptions, option 2/3 titles not overridable,
      missing result on timeout when timeout actions were disabled.

    ### Are button presses reaching Home Assistant?

      Developer Tools → Events → listen to `mobile_app_notification_action` → run the script →
      press a button on the phone. If no event shows up, the problem is the network or the app,
      not this script.

  input:
    ##############################
    # Devices
    ##############################
    section_devices:
      name: "📲 Devices and presence"
      icon: mdi:cellphone-message
      collapsed: false
      input:
        notify_devices:
          name: "📲 Devices to notify"
          description: >-
            One or more phones/tablets running the Home Assistant Companion app.


            **One device:** classic behaviour — you answer, the action runs.

            **Several devices:** all of them receive the notification. The first answer runs
            the action and stops listening; on the other devices the notification is replaced
            with "✅ <option> — <person>, <time>", without buttons, so nobody presses them in vain.
            Devices belonging to the person who answered are not updated.


            ⚠️ TVs (LG webOS, Android TV) do **not** appear here — they use a different kind of
            notification, without buttons.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        presence_filter:
          name: "🏠 Presence filter"
          description: >-
            Only notify devices whose owners are at home / away.


            Presence comes from the `person.*` entity that uses the phone's tracker; if there is
            none, from the phone's own `device_tracker`. A device without a tracker
            (e.g. a wall tablet) is **always** notified.


            Examples: "Only at home" for "you left the window open", "Only away" for
            "someone rang the intercom".
          default: all
          selector:
            select:
              options:
                - label: "Everyone (no filter)"
                  value: all
                - label: "Only those at home"
                  value: home
                - label: "Only those away"
                  value: away
        presence_bypass_critical:
          name: "🚨 Critical urgency bypasses the presence filter"
          description: "When enabled, a Critical notification reaches everyone, wherever they are."
          default: true
          selector:
            boolean:

    ##############################
    # Content
    ##############################
    section_content:
      name: "💬 Content"
      icon: mdi:message-text
      collapsed: false
      input:
        title:
          name: "🏷️ Title"
          description: "The bold top line. E.g. `Intercom`. Optional."
          default: ""
          selector:
            text:
        subtitle:
          name: "🏷️ Subtitle"
          description: >-
            The small line under the title. On iOS it is shown under the title; on Android it
            appears as extra text when the notification is expanded. Optional.
          default: ""
          selector:
            text:
        message:
          name: "💬 Message"
          description: >-
            The main text. On Android you can use simple HTML (`<b>`, `<i>`,
            `<font color="red">`). On iOS the tags show up as plain text, so avoid them if you have iPhones.
          selector:
            text:
              multiline: true
        notification_link:
          name: "🔗 Notification link"
          description: >-
            What opens when you tap the notification (not a button).


            - A dashboard: `/lovelace/intercom`

            - An entity's more-info panel (Android): `entityId:lock.front_door`

            - An app (Android): `app://com.spotify.music`

            - A web page: `https://example.com`

            - A deep link (Android): `deep-link://example://link/to/content`

            - Notification history (Android): `settings://notification_history`


            Empty = opens the HA app. Optional.
          default: ""
          selector:
            text:
        icon:
          name: "🙂 Icon (Android)"
          description: "The small status-bar icon. E.g. `mdi:doorbell`. Empty = HA icon."
          default: ""
          selector:
            icon:
        enable_icon_color:
          name: "🎨 Color the icon (Android)"
          description: "Applies the color below to the icon and the notification accent."
          default: false
          selector:
            boolean:
        icon_color:
          name: "🎨 Icon color (Android)"
          default: [102, 186, 240]
          selector:
            color_rgb:

    ##############################
    # Attachments
    ##############################
    section_attachments:
      name: "🖼️ Image"
      icon: mdi:image
      collapsed: true
      input:
        attachment_type:
          name: "🖼️ Image type"
          description: >-
            - **None**

            - **Camera**: a snapshot taken when the notification is sent. On iOS, long-press
            shows the live stream.

            - **URL**: any image — `/local/pictures/chart.png` (from `config/www`),
            `/media/local/x.jpg` or an `https://` link. Relative links only load when the
            phone can reach HA (at home or through your external URL).
          default: none
          selector:
            select:
              options:
                - label: "None"
                  value: none
                - label: "Camera"
                  value: camera_entity
                - label: "URL"
                  value: image_url
        attachment_camera_entity:
          name: "📸 Camera"
          description: "Only used with Image type = Camera."
          default: ""
          selector:
            entity:
              filter:
                - domain: camera
        attachment_image_url:
          name: "🌐 Image URL"
          description: "Only used with Image type = URL. E.g. `/local/intercom/last.jpg`."
          default: ""
          selector:
            text:

    ##############################
    # Urgency
    ##############################
    section_urgency:
      name: "🚦 Urgency"
      icon: mdi:alert
      collapsed: false
      input:
        urgency:
          name: "🚦 Urgency level"
          description: >-
            A single setting, translated automatically for each platform:


            | Level | Android | iOS |

            |---|---|---|

            | 🔕 Info | silent, only appears in the shade | silent, does not wake the screen |

            | 🔔 Normal | normal sound and vibration | normal sound |

            | ⚠️ Important | sound + heads-up banner | breaks through Focus |

            | 🚨 Critical | **alarm** sound, bypasses Do Not Disturb and silent mode | critical sound, bypasses Mute and Focus |


            On Android, each level has **its own channel** (see Channel prefix). In Settings → Apps
            → Home Assistant → Notifications you can change each channel's sound separately.


            ⚠️ Critical on iOS needs the "Critical Alerts" permission for the HA app
            (iOS asks for it on the first critical notification).
          default: normal
          selector:
            select:
              options:
                - label: "🔕 Info"
                  value: info
                - label: "🔔 Normal"
                  value: normal
                - label: "⚠️ Important"
                  value: important
                - label: "🚨 Critical"
                  value: critical
        quiet_enabled:
          name: "🌙 Quiet hours"
          description: >-
            During the window below, **Info and Normal** notifications follow the rule you
            choose. Important and Critical always go through.
          default: false
          selector:
            boolean:
        quiet_start:
          name: "🌙 Start"
          description: "May cross midnight (e.g. 22:30 → 07:00)."
          default: "22:30:00"
          selector:
            time:
        quiet_end:
          name: "🌅 End"
          default: "07:00:00"
          selector:
            time:
        quiet_mode:
          name: "🌙 What happens during quiet hours"
          description: >-
            - **Send silently**: delivered as Info (no sound, no TTS) — you see it in the morning.

            - **Don't send**: the script stops and returns `result: not_sent`.
          default: demote
          selector:
            select:
              options:
                - label: "Send silently"
                  value: demote
                - label: "Don't send"
                  value: skip

    ##############################
    # Buttons
    ##############################
    section_option_one:
      name: "1️⃣ Option 1"
      icon: mdi:numeric-1-box
      collapsed: true
      input:
        confirm_enabled:
          name: "1️⃣ Show option 1"
          default: true
          selector:
            boolean:
        confirm_text:
          name: "1️⃣ Button text"
          description: "E.g. `Open door`. Keep it short — Android truncates after ~15 characters."
          default: "Option 1"
          selector:
            text:
        confirm_option_mode:
          name: "1️⃣ Button mode (Android)"
          description: >-
            On Android a button can **either** run actions in HA **or** open a link — not both
            (app limitation: link buttons don't send an event back to HA).


            - **Actions**: runs "Option 1 actions". For a button that only dismisses the
            notification, pick Actions and leave the list empty.

            - **Link**: opens "Option 1 link". ⚠️ Does not stop the timeout.


            Ignored on iOS: if both are filled in, iOS does both.
          default: action
          selector:
            select:
              options:
                - label: "Actions"
                  value: action
                - label: "Link"
                  value: uri
        confirm_action:
          name: "1️⃣ Option 1 actions"
          description: "Runs when someone presses the button. The script ends after these."
          default: []
          selector:
            action:
        confirm_uri:
          name: "1️⃣ Option 1 link"
          description: >-
            Where to go when this button is pressed. Empty = no link.


            **Common**

            - HA dashboard / page: `/lovelace/cameras`, `/config/dashboard`

            - Web page (default browser): `https://example.com`


            **🤖 Android**

            - Open an app: `app://<package name>`, e.g. `app://com.google.android.apps.chromecast.app`

            - Entity more-info panel: `entityId:camera.front_door`

            - Deep link: `deep-link://<link>`, e.g. `deep-link://example://link/to/content`

            - Intent: `intent://scan/#Intent;scheme=zxing;package=com.my.pkg;end`

            - Notification history: `settings://notification_history`


            ** iOS**

            - App-launching URLs: `tel:0721000000`, `mailto:me@example.com`, or any app URL scheme


            ⚠️ Android: requires Button mode = **Link**, and it does not stop the timeout.
          default: ""
          selector:
            text:
        confirm_icon:
          name: "1️⃣ Button icon (iOS)"
          description: "SF Symbol name, e.g. `door.left.hand.open`. The prefix is added automatically."
          default: ""
          selector:
            text:
              prefix: "sfsymbols:"
        confirm_is_destructive:
          name: "1️⃣ Red button (iOS)"
          description: "Marks the button as a destructive action (red text)."
          default: false
          selector:
            boolean:
        confirm_authentication_required:
          name: "1️⃣ Require unlock (iOS)"
          description: "Recommended for actions like opening a door."
          default: false
          selector:
            boolean:

    section_option_two:
      name: "2️⃣ Option 2"
      icon: mdi:numeric-2-box
      collapsed: true
      input:
        dismiss_enabled:
          name: "2️⃣ Show option 2"
          default: true
          selector:
            boolean:
        dismiss_text:
          name: "2️⃣ Button text"
          description: "E.g. `Ignore`."
          default: "Option 2"
          selector:
            text:
        dismiss_option_mode:
          name: "2️⃣ Button mode (Android)"
          description: "See the explanation under Option 1."
          default: action
          selector:
            select:
              options:
                - label: "Actions"
                  value: action
                - label: "Link"
                  value: uri
        dismiss_action:
          name: "2️⃣ Option 2 actions"
          default: []
          selector:
            action:
        dismiss_uri:
          name: "2️⃣ Option 2 link"
          description: "Same formats as the Option 1 link (including `deep-link://`, `app://`, `intent://`)."
          default: ""
          selector:
            text:
        dismiss_icon:
          name: "2️⃣ Button icon (iOS)"
          default: ""
          selector:
            text:
              prefix: "sfsymbols:"
        dismiss_is_destructive:
          name: "2️⃣ Red button (iOS)"
          default: false
          selector:
            boolean:
        dismiss_authentication_required:
          name: "2️⃣ Require unlock (iOS)"
          default: false
          selector:
            boolean:

    section_option_three:
      name: "3️⃣ Option 3"
      icon: mdi:numeric-3-box
      collapsed: true
      input:
        option_three_enabled:
          name: "3️⃣ Show option 3"
          default: false
          selector:
            boolean:
        option_three_text:
          name: "3️⃣ Button text"
          default: "Option 3"
          selector:
            text:
        option_three_option_mode:
          name: "3️⃣ Button mode (Android)"
          description: "See the explanation under Option 1."
          default: action
          selector:
            select:
              options:
                - label: "Actions"
                  value: action
                - label: "Link"
                  value: uri
        option_three_action:
          name: "3️⃣ Option 3 actions"
          default: []
          selector:
            action:
        option_three_uri:
          name: "3️⃣ Option 3 link"
          description: "Same formats as the Option 1 link (including `deep-link://`, `app://`, `intent://`)."
          default: ""
          selector:
            text:
        option_three_icon:
          name: "3️⃣ Button icon (iOS)"
          default: ""
          selector:
            text:
              prefix: "sfsymbols:"
        option_three_is_destructive:
          name: "3️⃣ Red button (iOS)"
          default: false
          selector:
            boolean:
        option_three_authentication_required:
          name: "3️⃣ Require unlock (iOS)"
          default: false
          selector:
            boolean:

    ##############################
    # Timeout
    ##############################
    section_timeout:
      name: "⌛️ Timeout"
      icon: mdi:timer-sand
      collapsed: true
      input:
        enable_timeout:
          name: "⌛️ Enable timeout"
          description: >-
            How long the script listens for an answer.


            - **Enabled** (recommended): after the chosen duration it stops listening and runs
            "Timeout actions".

            - **Disabled**: listens until someone answers. A HA restart stops listening —
            buttons on older notifications do nothing after a restart.
          default: true
          selector:
            boolean:
        timeout:
          name: "⌛️ Duration"
          description: "At least 1 minute recommended, so the notification has time to arrive."
          default:
            hours: 0
            minutes: 15
            seconds: 0
          selector:
            duration:
              enable_day: false
        run_timeout_actions:
          name: "⌛️ Run timeout actions"
          default: true
          selector:
            boolean:
        timeout_action:
          name: "⌛️ Timeout actions"
          description: >-
            What happens if nobody answers. E.g. send a Critical notification,
            turn on a light. ⚠️ On Android, pressing a Link button does not stop the timeout.
          default: []
          selector:
            action:
        swipe_away_as_timeout:
          name: "👆 Swipe-away = timeout (Android)"
          description: >-
            If someone swipes the notification away, the timeout actions run immediately.
            With several devices, one swipe on any of them is enough.
            Does not work together with "Persistent notification".
          default: false
          selector:
            boolean:
        clear_on_timeout:
          name: "🧹 Clear notification on timeout"
          description: "When the timeout expires, the notification is removed from all devices."
          default: false
          selector:
            boolean:

    ##############################
    # Advanced Android
    ##############################
    section_android:
      name: "🤖 Advanced Android"
      icon: mdi:android
      collapsed: true
      input:
        channel_prefix:
          name: "📣 Channel prefix"
          description: >-
            Channels are created as `<prefix> Info`, `<prefix> Normal`, `<prefix> Important`.
            Critical uses the special `alarm_stream` channel.


            ⚠️ Android locks a channel's sound, importance, vibration and LED color **when the
            channel is first created**. If you change Vibration or LED below, also change the
            prefix (e.g. `Intercom`) so new channels are created — otherwise the change is ignored.
            A separate prefix per script also lets you use different sounds per notification type.
          default: "HA"
          selector:
            text:
        android_fast_delivery:
          name: "⚡ Fast delivery"
          description: >-
            Sends with high priority (`priority: high`, `ttl: 0`) so a phone in battery-saving
            mode doesn't delay the notification. Does not change the sound — urgency does that.
            Always on for Important and Critical.
          default: true
          selector:
            boolean:
        alert_once:
          name: "🔂 Alert once"
          description: >-
            If the same notification is updated (same tag), it won't sound/vibrate again.
            The "✅ answered by..." update always uses this.
          default: false
          selector:
            boolean:
        persist:
          name: "📌 Persistent notification"
          description: "Cannot be swiped away; disappears only on answer or timeout."
          default: false
          selector:
            boolean:
        sticky:
          name: "🧷 Sticky"
          description: "The notification stays after being tapped (but can still be swiped away)."
          default: false
          selector:
            boolean:
        chronometer:
          name: "⏱️ Countdown"
          description: "Shows the time left until the timeout. Only with timeout enabled."
          default: false
          selector:
            boolean:
        vibration_pattern:
          name: "📳 Vibration pattern"
          description: >-
            Alternating milliseconds of pause, vibrate, pause, vibrate...
            E.g. `0, 500, 200, 500` = two long vibrations. Empty = default.
            ⚠️ See the note under Channel prefix.
          default: ""
          selector:
            text:
        enable_led_color:
          name: "💡 LED color"
          description: "Only on phones that still have a notification LED. ⚠️ See the note under Channel prefix."
          default: false
          selector:
            boolean:
        led_color:
          name: "💡 LED color"
          default: [255, 0, 0]
          selector:
            color_rgb:
        visibility:
          name: "🔏 Lock screen visibility"
          description: >-
            - **Public**: full content is shown.

            - **Private**: follows the phone's settings.

            - **Secret**: not shown on the lock screen at all.
          default: private
          selector:
            select:
              options:
                - label: "Public"
                  value: public
                - label: "Private"
                  value: private
                - label: "Secret"
                  value: secret
        car_ui:
          name: "🚘 Show on Android Auto"
          default: false
          selector:
            boolean:
        tts_enabled:
          name: "🗣️ Read aloud (TTS)"
          description: >-
            The phone reads the message with its own voice engine, in addition to the normal
            notification. Not read at Info level (so not during quiet hours with "Send silently").
          default: false
          selector:
            boolean:
        tts_text:
          name: "🗣️ TTS text"
          description: "Empty = the notification message (HTML stripped)."
          default: ""
          selector:
            text:
        tts_stream:
          name: "🔊 TTS volume"
          description: >-
            - **Media**: the phone's media volume; not heard in silent mode.

            - **Alarm**: the alarm volume; heard even in silent / Do Not Disturb.

            - **Alarm (max)**: temporarily raises the alarm volume to maximum.
          default: music_stream
          selector:
            select:
              options:
                - label: "Media"
                  value: music_stream
                - label: "Alarm"
                  value: alarm_stream
                - label: "Alarm (max)"
                  value: alarm_stream_max

    ##############################
    # iOS
    ##############################
    section_ios:
      name: " iOS"
      icon: mdi:apple
      collapsed: true
      input:
        ios_sound:
          name: "🎵 Sound"
          description: >-
            The name of a sound in the app (Settings → Companion App → Notifications →
            Sounds), e.g. `US-EN-Alexa-Doorbell.wav`. Custom sounds are imported there too.
            Empty = default sound; `none` = no sound.
          default: ""
          selector:
            text:
        ios_critical_volume:
          name: "🔊 Critical volume"
          description: "Volume of the critical sound, 0–1. Plays even when the phone is on Mute."
          default: 1.0
          selector:
            number:
              min: 0
              max: 1
              step: 0.1
              mode: slider

    ##############################
    # Misc
    ##############################
    section_misc:
      name: "⚙️ Misc"
      icon: mdi:cog
      collapsed: true
      input:
        tag:
          name: "🔖 Tag"
          description: >-
            The notification's identifier. A new notification with the same tag **replaces**
            the old one instead of appearing separately. Empty (recommended) = unique tag per run.
            Example use: `intercom` — if it rings 3 times, you see a single notification.
          default: ""
          selector:
            text:
        group:
          name: "📣 Group"
          description: >-
            Notifications with the same group are shown together. E.g. `intercom`.
            On iOS, critical notifications are not grouped.
          default: ""
          selector:
            text:

##############################
# Fields (overrides when calling the script)
##############################
fields:
  field_notify_devices:
    name: "📲 Devices"
    description: "Override the device list."
    selector:
      device:
        multiple: true
        filter:
          - integration: mobile_app
  field_urgency:
    name: "🚦 Urgency"
    description: "info / normal / important / critical"
    example: normal
    selector:
      select:
        options:
          - info
          - normal
          - important
          - critical
  field_title:
    name: "🏷️ Title"
    selector:
      text:
  field_subtitle:
    name: "🏷️ Subtitle"
    selector:
      text:
  field_message:
    name: "💬 Message"
    selector:
      text:
        multiline: true
  field_notification_link:
    name: "🔗 Notification link"
    selector:
      text:
  field_attachment_type:
    name: "🖼️ Image type"
    selector:
      select:
        options:
          - none
          - camera_entity
          - image_url
  field_attachment_camera_entity:
    name: "📸 Camera"
    selector:
      entity:
        filter:
          - domain: camera
  field_attachment_image_url:
    name: "🌐 Image URL"
    selector:
      text:
  field_option_one_enabled:
    name: "1️⃣ Show option 1"
    selector:
      boolean:
  field_option_one_text:
    name: "1️⃣ Option 1 text"
    selector:
      text:
  field_option_one_mode:
    name: "1️⃣ Option 1 mode (Android)"
    description: "action / uri"
    selector:
      select:
        options:
          - action
          - uri
  field_option_one_uri:
    name: "1️⃣ Option 1 link"
    description: "E.g. deep-link://..., app://..., /lovelace/..."
    selector:
      text:
  field_option_two_enabled:
    name: "2️⃣ Show option 2"
    selector:
      boolean:
  field_option_two_text:
    name: "2️⃣ Option 2 text"
    selector:
      text:
  field_option_two_mode:
    name: "2️⃣ Option 2 mode (Android)"
    description: "action / uri"
    selector:
      select:
        options:
          - action
          - uri
  field_option_two_uri:
    name: "2️⃣ Option 2 link"
    description: "E.g. deep-link://..., app://..., /lovelace/..."
    selector:
      text:
  field_option_three_enabled:
    name: "3️⃣ Show option 3"
    selector:
      boolean:
  field_option_three_text:
    name: "3️⃣ Option 3 text"
    selector:
      text:
  field_option_three_mode:
    name: "3️⃣ Option 3 mode (Android)"
    description: "action / uri"
    selector:
      select:
        options:
          - action
          - uri
  field_option_three_uri:
    name: "3️⃣ Option 3 link"
    description: "E.g. deep-link://..., app://..., /lovelace/..."
    selector:
      text:
  field_enable_timeout:
    name: "⌛️ Enable timeout"
    selector:
      boolean:
  field_timeout:
    name: "⌛️ Timeout duration"
    selector:
      duration:
        enable_day: false
  field_run_timeout_actions:
    name: "⌛️ Run timeout actions"
    selector:
      boolean:
  field_tts_text:
    name: "🗣️ TTS text"
    selector:
      text:

sequence:
  ##############################
  # Base variables
  ##############################
  - alias: Content
    variables:
      script_title: !input title
      title: "{{ field_title if field_title is defined else script_title }}"
      script_subtitle: !input subtitle
      subtitle: "{{ field_subtitle if field_subtitle is defined else script_subtitle }}"
      script_message: !input message
      message: "{{ field_message if (field_message is defined and field_message | length) else script_message }}"
      script_notification_link: !input notification_link
      notification_link: "{{ field_notification_link if field_notification_link is defined else script_notification_link }}"
      custom_tag: !input tag
      tag: "{{ custom_tag if custom_tag | length else this.entity_id ~ '-' ~ context.id }}"
      group: !input group

  - alias: Urgency and quiet hours
    variables:
      script_urgency: !input urgency
      requested_level: "{{ field_urgency if field_urgency is defined else script_urgency }}"
      quiet_enabled: !input quiet_enabled
      quiet_start: !input quiet_start
      quiet_end: !input quiet_end
      quiet_mode: !input quiet_mode
      in_quiet_hours: >-
        {%- set t = now().strftime('%H:%M:%S') -%}
        {{ quiet_enabled and ((quiet_start <= t < quiet_end) if quiet_start <= quiet_end
                              else (t >= quiet_start or t < quiet_end)) }}
      quiet_applies: "{{ in_quiet_hours and requested_level in ['info', 'normal'] }}"
      level: "{{ 'info' if quiet_applies else requested_level }}"

  - alias: Android
    variables:
      channel_prefix: !input channel_prefix
      android_channel: >-
        {{ 'alarm_stream' if level == 'critical'
           else channel_prefix ~ ' ' ~ {'info': 'Info', 'normal': 'Normal', 'important': 'Important'}[level] }}
      android_importance: "{{ {'info': 'low', 'normal': 'default', 'important': 'high', 'critical': 'high'}[level] }}"
      android_fast_delivery: !input android_fast_delivery
      high_priority: "{{ android_fast_delivery or level in ['important', 'critical'] }}"
      visibility: !input visibility
      persist: !input persist
      sticky: !input sticky
      alert_once: !input alert_once
      car_ui: !input car_ui
      chronometer: !input chronometer
      vibration_pattern: !input vibration_pattern
      enable_led_color: !input enable_led_color
      led_color_rgb: !input led_color
      led_color_hex: '{{ "#{:02x}{:02x}{:02x}".format(led_color_rgb[0], led_color_rgb[1], led_color_rgb[2]) }}'
      notification_icon: !input icon
      enable_icon_color: !input enable_icon_color
      icon_color_rgb: !input icon_color
      icon_color_hex: '{{ "#{:02x}{:02x}{:02x}".format(icon_color_rgb[0], icon_color_rgb[1], icon_color_rgb[2]) }}'
      tts_enabled: !input tts_enabled
      script_tts_text: !input tts_text
      tts_text: >-
        {% set t = field_tts_text if field_tts_text is defined else script_tts_text %}
        {{ t if t | length else (message | striptags) }}
      tts_stream: !input tts_stream

  - alias: iOS
    variables:
      ios_sound: !input ios_sound
      ios_critical_volume: !input ios_critical_volume
      ios_level: "{{ {'info': 'passive', 'normal': 'active', 'important': 'time-sensitive', 'critical': 'critical'}[level] }}"

  - alias: Timeout
    variables:
      script_enable_timeout: !input enable_timeout
      enable_timeout: "{{ field_enable_timeout if field_enable_timeout is defined else script_enable_timeout }}"
      script_timeout: !input timeout
      timeout: "{{ field_timeout if field_timeout is defined else script_timeout }}"
      timeout_seconds: "{{ ((timeout.hours | default(0)) * 3600 + (timeout.minutes | default(0)) * 60 + (timeout.seconds | default(0))) | int }}"
      deadline_ts: "{{ (now().timestamp() + timeout_seconds) | int }}"
      script_run_timeout_actions: !input run_timeout_actions
      run_timeout_actions: "{{ field_run_timeout_actions if field_run_timeout_actions is defined else script_run_timeout_actions }}"
      swipe_away_as_timeout: !input swipe_away_as_timeout
      clear_on_timeout: !input clear_on_timeout

  - alias: Image
    variables:
      script_attachment_type: !input attachment_type
      attachment_type: "{{ field_attachment_type if field_attachment_type is defined else script_attachment_type }}"
      script_camera: !input attachment_camera_entity
      camera_entity: "{{ field_attachment_camera_entity if field_attachment_camera_entity is defined else script_camera }}"
      script_image_url: !input attachment_image_url
      image_url: "{{ field_attachment_image_url if field_attachment_image_url is defined else script_image_url }}"
      camera_image_url: >-
        {% if camera_entity | length %}
          {% set pic = state_attr(camera_entity, 'entity_picture') %}
          {{ pic if pic else '/api/camera_proxy/' ~ camera_entity }}
        {% endif %}

  - alias: Buttons
    variables:
      s_opt1_enabled: !input confirm_enabled
      s_opt1_title: !input confirm_text
      opt1_mode: !input confirm_option_mode
      opt1_uri: !input confirm_uri
      opt1_icon: !input confirm_icon
      opt1_destructive: !input confirm_is_destructive
      opt1_auth: !input confirm_authentication_required
      s_opt2_enabled: !input dismiss_enabled
      s_opt2_title: !input dismiss_text
      opt2_mode: !input dismiss_option_mode
      opt2_uri: !input dismiss_uri
      opt2_icon: !input dismiss_icon
      opt2_destructive: !input dismiss_is_destructive
      opt2_auth: !input dismiss_authentication_required
      s_opt3_enabled: !input option_three_enabled
      s_opt3_title: !input option_three_text
      opt3_mode: !input option_three_option_mode
      opt3_uri: !input option_three_uri
      opt3_icon: !input option_three_icon
      opt3_destructive: !input option_three_is_destructive
      opt3_auth: !input option_three_authentication_required
      option_one: >-
        {{ {'enabled': field_option_one_enabled if field_option_one_enabled is defined else s_opt1_enabled,
            'id': 'FIRST_' ~ context.id,
            'title': field_option_one_text if field_option_one_text is defined else s_opt1_title,
            'mode': field_option_one_mode if field_option_one_mode is defined else opt1_mode,
            'uri': field_option_one_uri if field_option_one_uri is defined else opt1_uri,
            'icon': ('' if not opt1_icon else (opt1_icon if opt1_icon.startswith('sfsymbols:') else 'sfsymbols:' ~ opt1_icon)),
            'destructive': opt1_destructive, 'auth': opt1_auth} }}
      option_two: >-
        {{ {'enabled': field_option_two_enabled if field_option_two_enabled is defined else s_opt2_enabled,
            'id': 'SECOND_' ~ context.id,
            'title': field_option_two_text if field_option_two_text is defined else s_opt2_title,
            'mode': field_option_two_mode if field_option_two_mode is defined else opt2_mode,
            'uri': field_option_two_uri if field_option_two_uri is defined else opt2_uri,
            'icon': ('' if not opt2_icon else (opt2_icon if opt2_icon.startswith('sfsymbols:') else 'sfsymbols:' ~ opt2_icon)),
            'destructive': opt2_destructive, 'auth': opt2_auth} }}
      option_three: >-
        {{ {'enabled': field_option_three_enabled if field_option_three_enabled is defined else s_opt3_enabled,
            'id': 'THIRD_' ~ context.id,
            'title': field_option_three_text if field_option_three_text is defined else s_opt3_title,
            'mode': field_option_three_mode if field_option_three_mode is defined else opt3_mode,
            'uri': field_option_three_uri if field_option_three_uri is defined else opt3_uri,
            'icon': ('' if not opt3_icon else (opt3_icon if opt3_icon.startswith('sfsymbols:') else 'sfsymbols:' ~ opt3_icon)),
            'destructive': opt3_destructive, 'auth': opt3_auth} }}
      any_option: "{{ option_one.enabled or option_two.enabled or option_three.enabled }}"
      expect_response: "{{ enable_timeout or any_option }}"

  ##############################
  # Target devices + presence filter
  ##############################
  - alias: Target devices
    variables:
      script_devices: !input notify_devices
      raw_devices: "{{ field_notify_devices if field_notify_devices is defined else script_devices }}"
      device_list: >-
        {% if raw_devices is string %}{{ [raw_devices] if raw_devices | length else [] }}
        {% else %}{{ raw_devices | list }}{% endif %}
      presence_filter: !input presence_filter
      presence_bypass_critical: !input presence_bypass_critical
      effective_filter: "{{ 'all' if (level == 'critical' and presence_bypass_critical) else presence_filter }}"
      targets: >-
        {% set ns = namespace(out=[]) %}
        {% for d in device_list %}
          {% set tracker = device_entities(d) | select('match', 'device_tracker\.') | list | first | default('') %}
          {% set person = (states.person | selectattr('attributes.device_trackers', 'defined')
                           | selectattr('attributes.device_trackers', 'contains', tracker)
                           | map(attribute='entity_id') | list | first | default('')) if tracker else '' %}
          {% set where = states(person) if person else (states(tracker) if tracker else 'unknown') %}
          {% set include = effective_filter == 'all' or not tracker
                           or (effective_filter == 'home' and where == 'home')
                           or (effective_filter == 'away' and where != 'home') %}
          {% if include %}
            {% set ns.out = ns.out + [{
              'id': d,
              'name': device_attr(d, 'name_by_user') or device_attr(d, 'name'),
              'service': 'notify.mobile_app_' ~ (device_attr(d, 'name') | slugify),
              'apple': 'APPLE' in (device_attr(d, 'manufacturer') | default('', true) | upper),
              'owner_uid': state_attr(person, 'user_id') if person else none
            }] %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}

  - alias: Stop if there is nothing to send
    if:
      - condition: template
        value_template: "{{ (quiet_applies and quiet_mode == 'skip') or targets | length == 0 }}"
    then:
      - variables:
          user_response: >-
            {{ {'result': 'not_sent',
                'reason': 'quiet_hours' if (quiet_applies and quiet_mode == 'skip') else 'no_devices',
                'level': level, 'devices': []} }}
      - stop: "Nothing to send."
        response_variable: user_response

  ##############################
  # Send
  ##############################
  - alias: Send to each device
    repeat:
      for_each: "{{ targets }}"
      sequence:
        - variables:
            dev: "{{ repeat.item }}"
            dev_options: >-
              {% set ns = namespace(l=[]) %}
              {% for o in [option_one, option_two, option_three] if o.enabled %}
                {% set is_link = (o.mode == 'uri' and not dev.apple) %}
                {% set a = {'action': 'URI' if is_link else o.id, 'title': o.title} %}
                {% if o.uri | length and (dev.apple or is_link) %}{% set a = dict(a, **{'uri': o.uri}) %}{% endif %}
                {% if dev.apple %}
                  {% if o.icon | length %}{% set a = dict(a, **{'icon': o.icon}) %}{% endif %}
                  {% if o.destructive %}{% set a = dict(a, **{'destructive': true}) %}{% endif %}
                  {% if o.auth %}{% set a = dict(a, **{'authenticationRequired': true}) %}{% endif %}
                {% endif %}
                {% set ns.l = ns.l + [a] %}
              {% endfor %}
              {{ ns.l }}
            dev_data: >-
              {% set d = {'tag': tag, 'actions': dev_options} %}
              {% if group | length %}{% set d = dict(d, **{'group': group}) %}{% endif %}
              {% if dev.apple %}
                {% set push = {'interruption-level': ios_level} %}
                {% if level == 'critical' %}
                  {% set push = dict(push, **{'sound': {'name': ios_sound if (ios_sound | length and ios_sound != 'none') else 'default', 'critical': 1, 'volume': ios_critical_volume | float}}) %}
                {% elif ios_sound | length %}
                  {% set push = dict(push, **{'sound': ios_sound}) %}
                {% endif %}
                {% set d = dict(d, **{'push': push}) %}
                {% if subtitle | length %}{% set d = dict(d, **{'subtitle': subtitle}) %}{% endif %}
                {% if notification_link | length %}{% set d = dict(d, **{'url': notification_link}) %}{% endif %}
                {% if attachment_type == 'camera_entity' and camera_entity | length %}
                  {% set d = dict(d, **{'entity_id': camera_entity}) %}
                {% elif attachment_type == 'image_url' and image_url | length %}
                  {% set d = dict(d, **{'image': image_url}) %}
                {% endif %}
              {% else %}
                {% set d = dict(d, **{'channel': android_channel, 'importance': android_importance, 'visibility': visibility}) %}
                {% if subtitle | length %}{% set d = dict(d, **{'subject': subtitle}) %}{% endif %}
                {% if high_priority %}{% set d = dict(d, **{'priority': 'high', 'ttl': 0}) %}{% endif %}
                {% if notification_link | length %}{% set d = dict(d, **{'clickAction': notification_link}) %}{% endif %}
                {% if attachment_type == 'camera_entity' and camera_image_url | trim | length %}
                  {% set d = dict(d, **{'image': camera_image_url | trim}) %}
                {% elif attachment_type == 'image_url' and image_url | length %}
                  {% set d = dict(d, **{'image': image_url}) %}
                {% endif %}
                {% if notification_icon | length %}{% set d = dict(d, **{'notification_icon': notification_icon}) %}{% endif %}
                {% if enable_icon_color %}{% set d = dict(d, **{'color': icon_color_hex}) %}{% endif %}
                {% if enable_timeout and clear_on_timeout %}{% set d = dict(d, **{'timeout': timeout_seconds}) %}{% endif %}
                {% if enable_timeout and chronometer %}{% set d = dict(d, **{'chronometer': true, 'when': deadline_ts, 'when_relative': false}) %}{% endif %}
                {% if persist %}{% set d = dict(d, **{'persistent': true}) %}{% endif %}
                {% if sticky %}{% set d = dict(d, **{'sticky': 'true'}) %}{% endif %}
                {% if alert_once %}{% set d = dict(d, **{'alert_once': true}) %}{% endif %}
                {% if car_ui %}{% set d = dict(d, **{'car_ui': true}) %}{% endif %}
                {% if vibration_pattern | length %}{% set d = dict(d, **{'vibrationPattern': vibration_pattern}) %}{% endif %}
                {% if enable_led_color %}{% set d = dict(d, **{'ledColor': led_color_hex}) %}{% endif %}
              {% endif %}
              {{ d }}
        - alias: Notification
          action: "{{ dev.service }}"
          continue_on_error: true
          data:
            title: "{{ title }}"
            message: "{{ message }}"
            data: "{{ dev_data }}"
        - alias: TTS (Android)
          if:
            - condition: template
              value_template: "{{ tts_enabled and not dev.apple and level != 'info' }}"
          then:
            - action: "{{ dev.service }}"
              continue_on_error: true
              data:
                message: TTS
                data:
                  tts_text: "{{ tts_text }}"
                  media_stream: "{{ tts_stream }}"

  ##############################
  # Wait for response
  ##############################
  - alias: Wait for response
    choose:
      - alias: With timeout
        conditions: "{{ expect_response and enable_timeout }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ option_one.id }}"
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ option_two.id }}"
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ option_three.id }}"
              - trigger: event
                event_type: mobile_app_notification_cleared
                event_data:
                  tag: "{{ tag }}"
            timeout: "{{ timeout }}"
            continue_on_timeout: true
      - alias: Without timeout
        conditions: "{{ expect_response and not enable_timeout }}"
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ option_one.id }}"
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ option_two.id }}"
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ option_three.id }}"
              - trigger: event
                event_type: mobile_app_notification_cleared
                event_data:
                  tag: "{{ tag }}"

  ##############################
  # Parse response
  ##############################
  - alias: Parse response
    variables:
      # wait.trigger holds an Event object that cannot be stored in a variable,
      # so the needed fields are extracted directly.
      got_event: "{{ wait is defined and wait.trigger is not none }}"
      event_type: "{{ wait.trigger.event.event_type if got_event else '' }}"
      event_action: "{{ (wait.trigger.event.data.action | default('')) if got_event else '' }}"
      responder_uid: "{{ wait.trigger.event.context.user_id if got_event else none }}"
      result: >-
        {%- if not expect_response -%}no_response
        {%- elif not got_event -%}timeout
        {%- elif event_type == 'mobile_app_notification_cleared' -%}
          {{- 'notification_cleared' if swipe_away_as_timeout else 'cleared_ignored' -}}
        {%- elif event_action == option_one.id -%}option_one
        {%- elif event_action == option_two.id -%}option_two
        {%- elif event_action == option_three.id -%}option_three
        {%- else -%}unknown{%- endif -%}
      chosen_title: >-
        {{ {'option_one': option_one.title, 'option_two': option_two.title,
            'option_three': option_three.title}.get(result, '') }}
      responder_person: >-
        {{ (states.person | selectattr('attributes.user_id', 'eq', responder_uid)
            | map(attribute='entity_id') | list | first | default('')) if responder_uid else '' }}
      responder_name: "{{ state_attr(responder_person, 'friendly_name') if responder_person else 'someone' }}"
      user_response: >-
        {{ {'result': result,
            'responded_by': responder_name if result.startswith('option_') else none,
            'responder_person': responder_person if result.startswith('option_') else none,
            'level': level,
            'quiet_hours': quiet_applies,
            'devices': targets | map(attribute='name') | list} }}

  ##############################
  # Update the notification on the other devices
  ##############################
  - alias: Update notification on the other devices
    if:
      - condition: template
        value_template: "{{ targets | length > 1 and result.startswith('option_') }}"
    then:
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ not (responder_uid and repeat.item.owner_uid == responder_uid) }}"
              then:
                - action: "{{ repeat.item.service }}"
                  continue_on_error: true
                  data:
                    title: "{{ title }}"
                    message: "✅ {{ chosen_title }} — {{ responder_name }}, {{ now().strftime('%H:%M') }}"
                    data: >-
                      {% if repeat.item.apple %}
                        {{ {'tag': tag, 'push': {'interruption-level': 'passive'}} }}
                      {% else %}
                        {{ {'tag': tag, 'channel': android_channel, 'alert_once': true} }}
                      {% endif %}

  ##############################
  # Actions
  ##############################
  - alias: Run actions
    choose:
      - alias: Timeout
        conditions: "{{ result == 'timeout' and run_timeout_actions }}"
        sequence: !input timeout_action
      - alias: Notification cleared
        conditions: "{{ result == 'notification_cleared' and run_timeout_actions }}"
        sequence: !input timeout_action
      - alias: Option 1
        conditions: "{{ result == 'option_one' }}"
        sequence: !input confirm_action
      - alias: Option 2
        conditions: "{{ result == 'option_two' }}"
        sequence: !input dismiss_action
      - alias: Option 3
        conditions: "{{ result == 'option_three' }}"
        sequence: !input option_three_action

  ##############################
  # Clear on timeout (iOS has no auto-clear; Android handles it itself)
  ##############################
  - alias: Clear iOS notifications on timeout
    if:
      - condition: template
        value_template: "{{ result == 'timeout' and enable_timeout and clear_on_timeout }}"
    then:
      - repeat:
          for_each: "{{ targets | selectattr('apple') | list }}"
          sequence:
            - action: "{{ repeat.item.service }}"
              continue_on_error: true
              data:
                message: clear_notification
                data:
                  tag: "{{ tag }}"

  - stop: "Done."
    response_variable: user_response
